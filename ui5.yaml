specVersion: "4.0"
metadata:
    name: thankyou
type: application
framework:
    name: OpenUI5
    version: "1.151.0"
    libraries:
        - name: sap.ui.core
        - name: sap.m
        - name: sap.f
        - name: sap.ui.layout
        - name: themelib_sap_horizon
builder:
    customTasks:
        - name: ui5-tooling-transpile-task
          afterTask: replaceVersion
server:
    customMiddleware:
        - name: ui5-tooling-transpile-middleware
          afterMiddleware: compression
